name: Reduced Motion Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  reduced-motion:
    name: Visual regression & audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Start dev server
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          bun run dev &
          echo $! > .dev-server.pid
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      - name: Run reduced-motion Playwright tests
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ""
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          bunx playwright test \
            tests/reduced-motion.spec.ts \
            tests/reduced-motion-mobile.spec.ts \
            tests/reduced-motion-dnd.spec.ts \
            tests/reduced-motion-dnd-touch.spec.ts \
            tests/reduced-motion-audit.spec.ts \
            tests/reduced-motion-toast-variants.spec.ts \
            tests/reduced-motion-visual.spec.ts \
            tests/reduced-motion-toast-visual.spec.ts \
            --reporter=list,html

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .dev-server.pid ]; then
            kill "$(cat .dev-server.pid)" || true
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload snapshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/**/*-snapshots/**
          retention-days: 14
          if-no-files-found: ignore